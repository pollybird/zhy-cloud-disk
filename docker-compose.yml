services:
  app:
    build: .
    container_name: zhy-app
    restart: unless-stopped
    environment:
      # ---- Docker 模式：内置 MySQL + Redis，无需配置数据库连接 ----
      ZHY_DOCKER: "1"
      ZHY_INSTANCE_DIR: /app/instance
      ZHY_STORAGE_DIR: /app/storage
      # ---- 超级管理员（首次启动静默安装生效） ----
      ZHY_ADMIN_USERNAME: ${ZHY_ADMIN_USERNAME:-admin}
      # H1：未显式设置密码即启动失败，杜绝“忘记改密码”导致的默认凭据
      ZHY_ADMIN_PASSWORD: ${ZHY_ADMIN_PASSWORD:?必须在 .env 中设置 ZHY_ADMIN_PASSWORD 强随机密码（勿用示例值，可用 openssl rand -base64 18 生成，或执行 ./deploy.sh init 自动生成）}
      ZHY_ADMIN_EMAIL: ${ZHY_ADMIN_EMAIL:-admin@zhy.local}
      # ---- 部门共享网盘（首次安装生效；默认开启） ----
      ZHY_DEPARTMENT_DRIVE: ${ZHY_DEPARTMENT_DRIVE:-true}
      # ---- JWT 有效期 ----
      ZHY_JWT_ACCESS_HOURS: ${ZHY_JWT_ACCESS_HOURS:-2}
      ZHY_JWT_REFRESH_DAYS: ${ZHY_JWT_REFRESH_DAYS:-30}
      # ---- 默认配额（字节；默认 5GiB） ----
      ZHY_DEFAULT_QUOTA: ${ZHY_DEFAULT_QUOTA:-5368709120}
      # ---- CORS（M2：生产默认留空=禁止跨域；镜像前后端同源无需配置。
      #      独立域名前端部署时设置，如 https://disk.example.com） ----
      ZHY_CORS_ORIGINS: ${ZHY_CORS_ORIGINS:-}
    volumes:
      - app-instance:/app/instance
      - app-storage:/app/storage
      - app-mysql:/var/lib/mysql
    ports:
      - "${ZHY_WEB_PORT:-8080}:80"
    networks:
      - zhy-net

volumes:
  app-instance:
  app-storage:
  app-mysql:

networks:
  zhy-net:
    driver: bridge
