appId: cn.tzzhy.clouddisk
productName: 钟毓云盘
directories:
  output: build
files:
  - out/**/*
  - resources/**/*
win:
  target:
    - target: portable
      arch: [x64]
  icon: resources/icon.png
  signtoolOptions: null
  signAndEditExecutable: false
portable:
  artifactName: ${productName}-${version}-portable.exe
mac:
  target:
    - target: zip
      arch: [x64, arm64]
  icon: resources/icon.png
  category: public.app-category.productivity
linux:
  target: AppImage
  icon: resources/icon.png
  category: Network
